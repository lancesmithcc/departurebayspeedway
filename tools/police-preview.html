<!doctype html><html lang="en"><head><meta charset="utf-8"><title>RCMP officer workshop</title><style>body{margin:0;background:#9db4c0;font:15px system-ui}header{position:absolute;left:20px;top:20px;background:#182b37ec;color:white;padding:18px;border-radius:8px;max-width:420px}h1{font-size:21px;margin:0 0 8px}button{padding:9px;margin:3px;cursor:pointer}p{line-height:1.5}canvas{display:block}</style><script type="importmap">{"imports":{"three":"../lib/build/three.module.js","three/addons/":"../lib/examples/jsm/"}}</script></head><body><header><h1>RCMP officer workshop</h1><button id="run">Run</button><button id="aim">Aim</button><button id="flash">Fire</button><p>Reference duty uniform: grey shirt, black vest, shoulder insignia, duty belt, striped navy trousers and navy duty cap. Drag to rotate; scroll to zoom.</p></header><script type="module">
import * as THREE from 'three';import{buildPoliceOfficer,animatePoliceOfficer}from'../src/police.js';import{buildReferenceVehicle}from'../src/traffic-models.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#9db4c0');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(-3.2,2.2,-5.8);scene.add(new THREE.HemisphereLight(0xe2f0ff,0x736b51,2.5));const sun=new THREE.DirectionalLight(0xffe8c6,3.2);sun.position.set(-5,8,-5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x626968,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const officer=buildPoliceOfficer();scene.add(officer);const car=new THREE.Group();for(const p of buildReferenceVehicle('rcmp')){const mesh=new THREE.Mesh(p.geometry,p.material);mesh.castShadow=true;car.add(mesh);}car.position.set(3,0,2.5);scene.add(car);let mode='aim',flash=0,time=0,last=performance.now(),drag=false,x=0;document.querySelector('#run').onclick=()=>mode='run';document.querySelector('#aim').onclick=()=>mode='aim';document.querySelector('#flash').onclick=()=>{mode='aim';flash=.15};renderer.domElement.onpointerdown=e=>{drag=true;x=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(drag){officer.rotation.y+=(e.clientX-x)*.01;x=e.clientX}};renderer.domElement.onwheel=e=>{e.preventDefault();camera.position.multiplyScalar(e.deltaY>0?1.08:.92)};renderer.setAnimationLoop(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;time+=dt;flash=Math.max(0,flash-dt);animatePoliceOfficer(officer,time,mode,flash>0);camera.lookAt(0,.95,0);renderer.render(scene,camera)});onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};window.policePreview={scene,officer};
</script></body></html>
