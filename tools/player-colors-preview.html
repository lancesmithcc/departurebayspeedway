import * as THREE from 'three';import {loadGLB,levelModel,fitModel} from '../src/models.js';import {AuthoredRiderAnimation} from '../src/authored-rider-animation.js';import {colorRider,PLAYER_COLORS,PLAYER_COLOR_NAMES} from '../src/player-colors.js';
