<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Departure Bay voice studio</title><style>body{background:#101821;color:#eaf2f3;font:16px system-ui;margin:32px;max-width:1100px}h1{font-size:32px}button,select{padding:12px;margin:4px;background:#263947;color:white;border:1px solid #517383;border-radius:6px}.lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}article{padding:16px;background:#1b2934;border-radius:10px}p{min-height:48px}small{color:#98b7be}audio{width:100%}</style><h1>Departure Bay voice studio</h1><p>Separate bicycle and dessert reactions. Select a voice pool, then listen to the new recorded lines.</p><section><h2>In-game performance</h2><select id="actor"></select><select id="event"><option>bike</option><option>bar</option><option>greet</option><option>rise</option></select><button id="perform">Play variation</button><p id="take">Choose a character and event. Each character keeps a stable voice and subtle pitch variation.</p></section><label>Voice pool <select id="banks"></select></label><div class="lines" id="lines"></div><script type="module">import {DIALOGUE_LINES} from '../src/dialogue.js';import {AudioSys} from '../src/audio.js';
const cast={
'Street man':{voiceGender:'male'},'Street woman':{voiceGender:'female'},
'Boy':{voiceGender:'male',kid:true},'Girl':{voiceGender:'female',kid:true},
'Church man':{voiceGender:'male',party:true},'Church woman':{voiceGender:'female',party:true},
'Hell man':{voiceGender:'male',party:true,hell:true},'Hell woman':{voiceGender:'female',party:true,hell:true},
'Jesus':{persona:'jesus',voiceGender:'male'},'Satan':{persona:'satan',voiceGender:'male'},
'Driver man':{driver:true,voiceGender:'male'},'Driver woman':{driver:true,voiceGender:'female'}};
const actor=document.querySelector('#actor');for(const name of Object.keys(cast)){const o=document.createElement('option');o.textContent=name;actor.append(o)}
const audioSys=new AudioSys();window.voiceStudio=audioSys;
document.querySelector('#perform').onclick=async()=>{
 if(!audioSys.ready){audioSys.ctx=new AudioContext();audioSys.master=audioSys.ctx.createGain();audioSys.master.connect(audioSys.ctx.destination);audioSys.ready=true;}
 await audioSys.ctx.resume();audioSys.stopVoice(0);audioSys.voiceUntil=0;audioSys.voicePriority=0;
 const result=await audioSys.dialogue(document.querySelector('#event').value,{...cast[actor.value],voiceId:actor.value},3);
 document.querySelector('#take').textContent=result?DIALOGUE_LINES.find(x=>x.key===result.key).text+' — '+result.duration.toFixed(2)+' s, pitch '+result.pitch.toFixed(3)+'×':'This event does not apply to this character.';
};const banks=document.querySelector('#banks'),out=document.querySelector('#lines');for(const bank of [...new Set(DIALOGUE_LINES.map(x=>x.bank))]){const o=document.createElement('option');o.value=bank;o.textContent=bank.replaceAll('_',' ');banks.append(o)}function show(){out.replaceChildren();for(const line of DIALOGUE_LINES.filter(x=>x.bank===banks.value)){const a=document.createElement('article'),p=document.createElement('p'),s=document.createElement('small'),audio=document.createElement('audio');p.textContent=line.text;s.textContent=line.gender+' · '+line.voice;audio.controls=true;audio.preload='none';audio.src='../audio/voices/'+line.key+'.wav';a.append(s,p,audio);out.append(a)}}banks.addEventListener('change',show);show();</script></html>
