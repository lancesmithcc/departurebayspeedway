<!doctype html><html lang="en"><meta charset="utf-8"><title>Departure Bay · pickup detail</title><style>body{margin:0;background:#202a30;color:#fff;font:15px system-ui}header{position:absolute;top:24px;left:30px}h1{font-size:24px;margin:0 0 8px}p{color:#c5d0d2}button{padding:9px 14px;margin:3px;border:1px solid #66777b;border-radius:6px;background:#334248;color:white;cursor:pointer}footer{position:absolute;bottom:24px;width:100%;text-align:center;color:#c5d0d2}</style><script type="importmap">{"imports":{"three":"/lib/build/three.module.js"}}</script><header><h1>Departure Bay • pickup detail</h1><p>Lucky Lager • Double-double • Nanaimo bars • Blessing</p><button onclick="REVIEW.select(-1)">All items</button><button onclick="REVIEW.select(0)">Lucky</button><button onclick="REVIEW.select(1)">Coffee</button><button onclick="REVIEW.select(2)">Nanaimo bars</button><button onclick="REVIEW.select(3)">Blessing</button><button onclick="REVIEW.spin=!REVIEW.spin">Pause rotation</button></header><footer>Original modeled packaging and materials · game-ready shared bar geometry</footer><script type="module">
import * as T from 'three';import {createLuckyCase,createCoffee,createBarCrate,createBlessing} from '/src/pickup-models.js';
const scene=new T.Scene();scene.background=new T.Color('#202a30');const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);const camera=new T.PerspectiveCamera(34,innerWidth/innerHeight,.01,100);scene.add(new T.HemisphereLight(0xdceaff,0x63503b,2));for(const [x,y,z,power,color] of [[-3,5,4,4,0xffe1bb],[3,2,-2,3,0xd3eaff]]){const l=new T.DirectionalLight(color,power);l.position.set(x,y,z);scene.add(l)}const items=[createLuckyCase(),createCoffee(),createBarCrate(),createBlessing()];items.forEach((g,i)=>{scene.add(g);g.position.x=(i-1.5)*1.65});
window.REVIEW={scene,camera,items,renderer,spin:true,selected:-1,select(i){this.selected=i;items.forEach((g,k)=>{g.visible=i<0||k===i;g.position.x=i<0?(k-1.5)*1.65:0});camera.position.set(0,i<0?3.1:1.45,i<0?10:3.5);camera.lookAt(0,0,0)}};REVIEW.select(-1);const clock=new T.Clock();renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(REVIEW.spin)items.forEach(g=>g.rotation.y+=dt*.27);renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
