<!doctype html><html><head><meta charset="utf-8"><title>Authored rider animation review</title><style>body{margin:0;background:#18252e;color:white;font:14px system-ui}aside{position:absolute;top:20px;left:24px;max-width:380px}button{padding:8px;margin:4px}</style><script type="importmap">{"imports":{"three":"/lib/build/three.module.js","three/addons/":"/lib/examples/jsm/"}}</script></head><body><aside><b>Original GLB · animation review</b><p id="status">Loading original asset…</p><button onclick="PREVIEW.side()">Side</button><button onclick="PREVIEW.front()">Front</button><button onclick="PREVIEW.rear()">Rear</button><button onclick="PREVIEW.mode='idle'">Idle</button><button onclick="PREVIEW.mode='ride'">Ride</button><button onclick="PREVIEW.mode='brake'">Brake</button><button onclick="PREVIEW.impact()">Land</button></aside><script type="module">
import {AuthoredRiderAnimation} from '/src/authored-rider-animation.js';import * as T from 'three';import {loadGLB,levelModel,fitModel} from '/src/models.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#23323d');const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);
scene.add(new T.HemisphereLight(0xcde7ff,0x796047,2));const light=new T.DirectionalLight(0xffead3,3);light.position.set(3,5,2);scene.add(light);
const grid=new T.GridHelper(10,20,0x59717d,0x344955);scene.add(grid);
const raw=await loadGLB('/Main-Character/gla6ndzKeKQ4tFJdAE4lu_model.glb');const model=levelModel(raw)||raw;fitModel(model,2.15,'z');model.rotation.y+=Math.PI;scene.add(model);scene.updateMatrixWorld(true);
window.PREVIEW={T,scene,camera,model,mode:'idle',side(){camera.position.set(4,2,0);camera.lookAt(0,1,0)},front(){camera.position.set(0,1.9,-4.5);camera.lookAt(0,1,0)},rear(){camera.position.set(2.7,2.2,3.4);camera.lookAt(0,1,0)},impact(){}};PREVIEW.rig=new AuthoredRiderAnimation(model,scene);PREVIEW.player={v:0,grounded:true};PREVIEW.impact=()=>PREVIEW.player._landingImpact=14;PREVIEW.animate=dt=>{const p=PREVIEW.player,t=PREVIEW.rig.time;p.v=PREVIEW.mode==='idle'?0:22;p._lastThrottle=PREVIEW.mode==='ride'?1:0;p._lastBrake=PREVIEW.mode==='brake'?1:0;p.lean=PREVIEW.mode==='ride'?Math.sin(t)*.5:0;p.steerVis=PREVIEW.mode==='ride'?Math.sin(t)*.8:0;PREVIEW.rig.update(dt,p)};PREVIEW.side();document.querySelector('#status').textContent='Original mesh and textures. Live breathing, posture, counter-lean and landing response.';
const clock=new T.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);PREVIEW.animate?.(dt);renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
