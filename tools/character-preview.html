<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Departure Bay locals — character workshop</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#899da4;font:15px system-ui;color:#fff}header{position:absolute;z-index:1;left:20px;top:20px;background:#1a2734ed;padding:18px 22px;border-radius:12px;max-width:360px}h1{font-size:20px;margin:0 0 10px}p{line-height:1.5;margin:8px 0}button,select{padding:8px;margin:4px 2px;cursor:pointer}canvas{display:block}small{opacity:.75}</style><script type="importmap">{"imports":{"three":"../lib/build/three.module.js","three/addons/":"../lib/examples/jsm/"}}</script></head><body><header><h1>Meet the Departure Bay locals</h1><select id="cast"></select><br><button id="walk">Walk</button><button id="dance">Dance</button><button id="pause">Pause</button><p id="name"></p><small>Drag to turn · Scroll to inspect details<br>Adult fictional characters, articulated limbs, grounded steps and independent hand motion.</small></header><script type="module">
import * as THREE from 'three';import {buildCharacter,animateCharacter,CHARACTER_KINDS} from '../src/character-cast.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x899da4);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.05,100);camera.position.set(2.7,1.85,4.6);scene.add(new THREE.HemisphereLight(0xd6ecff,0x6a4935,2.5));const sun=new THREE.DirectionalLight(0xffe4c8,3);sun.position.set(3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-3;sun.shadow.camera.right=3;sun.shadow.camera.top=3;sun.shadow.camera.bottom=-3;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x607275,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);let person,time=0,paused=false,mode,last=performance.now();const select=document.querySelector('#cast');for(const kind of CHARACTER_KINDS){const opt=document.createElement('option');opt.value=kind;opt.textContent=kind;select.append(opt);}function show(){if(person){scene.remove(person);const materials=new Set();person.traverse(o=>{if(o.isMesh){o.geometry.dispose();materials.add(o.material);}});materials.forEach(m=>m.dispose());}person=buildCharacter(select.value);person.traverse(o=>{if(o.isMesh)o.castShadow=true;});scene.add(person);mode=person.userData.dance?'dance':'walk';document.querySelector('#name').textContent=person.name;window.characterPreview={scene,person};}select.onchange=show;show();document.querySelector('#walk').onclick=()=>mode='walk';document.querySelector('#dance').onclick=()=>mode='dance';document.querySelector('#pause').onclick=()=>paused=!paused;let drag=false,x=0;renderer.domElement.onpointerdown=e=>{drag=true;x=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(drag){person.rotation.y+=(e.clientX-x)*.01;x=e.clientX;}};renderer.domElement.onwheel=e=>{e.preventDefault();camera.position.multiplyScalar(e.deltaY>0?1.06:.94)};renderer.setAnimationLoop(()=>{const now=performance.now();if(!paused)time+=(now-last)/1000*.8;last=now;animateCharacter(person,time,mode);camera.lookAt(0,1,0);renderer.render(scene,camera)});onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
