<!doctype html><html><head><meta charset="utf-8"><title>Departure Bay vehicle workshop</title><style>body{margin:0;background:#14222d;color:#fff;font:16px system-ui}header{position:absolute;top:20px;left:24px;z-index:1;background:rgba(16,29,39,.9);padding:16px;border-radius:8px}h1{font-size:22px;margin:0 0 8px}button{padding:8px 16px;margin:4px;border:1px solid #667d8e;border-radius:5px;background:#243a4a;color:white;cursor:pointer}p{max-width:600px;font-size:14px;color:#cbd9e4}canvas{display:block}</style><script type="importmap">{"imports":{"three":"../lib/build/three.module.js","three/addons/":"../lib/examples/jsm/"}}</script></head><body><header><h1>Departure Bay · vehicle workshop</h1><nav><button data-type="bus">BC Transit</button><button data-type="cybertruck">Cybertruck</button><button data-type="rcmp">RCMP SUV</button></nav><p>Drag to rotate · scroll to zoom. Reference liveries, modelled bodywork and grounded tyres. Bus destination adapted to Departure Bay.</p></header><script type="module">
import * as THREE from 'three';import {buildReferenceVehicle} from '../src/traffic-models.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a5bdc9');const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);const controls={target:new THREE.Vector3(),update(){camera.lookAt(this.target)}};let dragging=false,lastX=0;renderer.domElement.onpointerdown=e=>{dragging=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>dragging=false;renderer.domElement.onpointermove=e=>{if(dragging&&group){group.rotation.y+=(e.clientX-lastX)*.009;lastX=e.clientX}};renderer.domElement.onwheel=e=>{e.preventDefault();camera.position.multiplyScalar(e.deltaY>0?1.08:.92) };scene.add(new THREE.HemisphereLight(0xdcefff,0x787061,2.4));const sun=new THREE.DirectionalLight(0xffeed5,3.4);sun.position.set(-8,14,-9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12});scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x61696b,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.y=-.01;ground.receiveShadow=true;scene.add(ground);let group;
function show(type){if(group){scene.remove(group);group.traverse(o=>{o.geometry?.dispose();if(o.material){o.material.map?.dispose();o.material.dispose();}});}group=new THREE.Group();for(const p of buildReferenceVehicle(type)){const m=new THREE.Mesh(p.geometry,p.material);m.castShadow=m.receiveShadow=true;group.add(m);}scene.add(group);const bus=type==='bus';camera.position.set(bus?-11:-6,bus?5.7:3.4,bus?-14:-7);controls.target.set(0,bus?1.4:.9,0);controls.update();window.vehiclePreview={scene,group,type};}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.type));show('bus');renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};
</script></body></html>
